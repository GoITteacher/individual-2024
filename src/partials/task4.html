<section class="block">
  <form class="search-form js-student-form">
    <div class="form-group m-2">
      <input type="text" class="form-control" name="lastname" />
    </div>

    <button type="submit" class="btn btn-primary">Search</button>
  </form>
  <form class="search-form js-create-student-form">
    <div class="form-group m-2">
      <input
        type="text"
        class="form-control"
        name="firstName"
        placeholder="firstName"
      />
    </div>
    <div class="form-group m-2">
      <input
        type="text"
        class="form-control"
        name="lastName"
        placeholder="lastName"
      />
    </div>
    <div class="form-group m-2">
      <input
        type="text"
        class="form-control"
        name="major"
        placeholder="major"
      />
    </div>
    <div class="form-group m-2">
      <input
        type="number"
        class="form-control"
        name="cohortYear"
        placeholder="cohortYear"
      />
    </div>
    <div class="form-group m-2">
      <input type="number" class="form-control" name="gpa" placeholder="gpa" />
    </div>
    <div class="form-group m-2">
      <input
        type="checkbox"
        class="form-control"
        name="enrolled"
        placeholder="enrolled"
      />
    </div>

    <button type="submit" class="btn btn-primary">Create Student</button>
  </form>

  <ul class="list fb js-student-ul"></ul>
</section>
