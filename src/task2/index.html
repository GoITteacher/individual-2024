<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../modal.css" />
    <title>EXAMPLE</title>
  </head>
  <body>
    <div class="js-form-container fb fb-h">
      <form class="form box js-form">
        <input
          type="text"
          name="name"
          placeholder="Name"
          class="form-control"
        />
        <input
          type="text"
          name="surname"
          placeholder="Surname"
          class="form-control"
        />
        <input
          type="number"
          name="age"
          placeholder="Age"
          class="form-control"
        />
        <input
          type="text"
          name="gender"
          placeholder="Gender"
          class="form-control"
        />
        <input
          type="phone"
          name="phone-number"
          placeholder="Phone-number"
          class="form-control"
        />
        <input
          type="email"
          name="email"
          placeholder="Mail"
          class="form-control"
        />

        <button class="form-control" type="submit">Create item</button>
      </form>

      <div class="box" style="width: fit-content">
        <input type="text" class="js-filters" />
        <ul class="js-items list"></ul>
      </div>
    </div>
    <div class="backdrop hidden js-backdrop">
      <div class="modalka js-modal"></div>
    </div>

    <script type="module" src="./index.js"></script>
  </body>
</html>
